management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

spring:
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://spring-boot-admin:8080}
        instance:
          service-base-url: http://manager:${SERVER_PORT:8082}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/service-portal-manager}
      database: ${MONGODB_DATABASE:service-portal-manager}

manager:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_PLEASE_THIS_IS_A_DEV_ONLY_SECRET_AT_LEAST_64_CHARS_LONG_FOR_HS512}
      expiration-seconds: ${JWT_EXPIRATION:3600}
      issuer: ${JWT_ISSUER:service-portal-manager}
    admin:
      username: ${MANAGER_ADMIN_USERNAME:admin}
      password: ${MANAGER_ADMIN_PASSWORD:admin}

orchestrator:
  url: ${ORCHESTRATOR_URL:http://orchestrator:8080}
  admin-username: ${ORCHESTRATOR_ADMIN_USERNAME:admin}
  admin-password: ${ORCHESTRATOR_ADMIN_PASSWORD:admin}

logging:
  level:
    root: INFO
    com.serviceportal.manager: INFO
